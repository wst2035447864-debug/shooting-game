<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>移动射击练习场</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101827;
      color: #edf4ff;
      font-family: system-ui, sans-serif;
    }
    main {
      max-width: 960px;
      margin: auto;
      padding: 24px 16px;
    }
    h1 { margin: 0 0 8px; }
    .intro { color: #a6bad1; margin-bottom: 20px; }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }
    .stat {
      flex: 1;
      min-width: 130px;
      padding: 14px;
      background: #1b293d;
      border-radius: 12px;
    }
    .stat span {
      display: block;
      color: #a6bad1;
      font-size: 13px;
      margin-bottom: 5px;
    }
    .stat strong { font-size: 23px; }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #152238;
      border: 1px solid #344b68;
      border-radius: 14px;
      cursor: crosshair;
      touch-action: none;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }
    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 20px;
      background: #65baff;
      color: #102033;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button.secondary {
      background: #293b52;
      color: white;
    }
    button:disabled { opacity: 0.45; cursor: default; }
    #message { min-height: 26px; color: #ffd58a; }
    .tips { color: #a6bad1; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>移动射击练习场</h1>
  <div class="intro">移动鼠标瞄准 · 点击射击 · 按 R 换弹</div>

  <div class="stats">
    <div class="stat">
  <span>金币</span>
  <strong id="coins">0</strong>
</div>
    <div class="stat">
      <span>目标血量</span>
      <strong id="health">100</strong>
    </div>
    <div class="stat">
      <span>弹匣</span>
      <strong id="ammo">12 / 12</strong>
    </div>
    <div class="stat">
      <span>击杀数</span>
      <strong id="kills">0</strong>
    </div>
    <div class="stat">
      <span>命中率</span>
      <strong id="accuracy">—</strong>
    </div>
  </div>

  <canvas id="game" width="900" height="480"
    aria-label="移动射击练习场，请使用鼠标瞄准并点击射击">
  </canvas>

  <div class="controls">
    <button id="reloadButton">换弹（R）</button>
    <button id="restartButton" class="secondary">重新开始</button>
  </div>

  <p id="message">瞄准移动目标，点击开始射击。</p>
  <p class="tips">
    头部伤害50 · 上身25 · 下身20 · 打空也消耗子弹<br>
    击败目标后3秒出现新目标，子弹不会自动补满。
  </p>
</main>

<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const reloadButton = document.getElementById("reloadButton");

  // 游戏参数：可以让弟弟尝试修改这些数值
  const MAGAZINE_SIZE = 12;
  const SHOT_INTERVAL = 300;
  const RELOAD_TIME = 1500;
  const TARGET_SPEED = 110;

  let health = 100;
  let ammo = MAGAZINE_SIZE;
  let kills = 0;
  let coins = 0;
  let shots = 0;
  let hits = 0;
  let isReloading = false;
  let reloadEndsAt = 0;
  let respawnAt = 0;
  let lastShotTime = -Infinity;

  const target = { x: 450, direction: 1 };
  const mouse = { x: 450, y: 240, inside: false };
  let shotEffect = null;

  function say(text) {
    document.getElementById("message").textContent = text;
  }

  function updateScreen() {
    document.getElementById("coins").textContent = coins;
    document.getElementById("health").textContent = health;
    document.getElementById("ammo").textContent =
      ammo + " / " + MAGAZINE_SIZE;
    document.getElementById("kills").textContent = kills;
    document.getElementById("accuracy").textContent =
      shots === 0 ? "—" : Math.round(hits / shots * 100) + "%";

    reloadButton.disabled = isReloading || ammo === MAGAZINE_SIZE;
    reloadButton.textContent = isReloading ? "换弹中……" : "换弹（R）";
  }

  // 把浏览器中的鼠标位置，换算为画布坐标
  function getPosition(event) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (event.clientX - rect.left) * canvas.width / rect.width,
      y: (event.clientY - rect.top) * canvas.height / rect.height
    };
  }

  function insideRect(x, y, left, top, width, height) {
    return x >= left && x <= left + width &&
           y >= top && y <= top + height;
  }

  // 画目标和判断命中，使用相同的位置与尺寸
  function getTargetParts() {
    return [
      { name: "头部", damage: 50, color: "#ffb454",
        x: target.x - 25, y: 140, w: 50, h: 50 },
      { name: "上身", damage: 25, color: "#65baff",
        x: target.x - 42, y: 190, w: 84, h: 100 },
      { name: "下身", damage: 20, color: "#91d79a",
        x: target.x - 36, y: 290, w: 72, h: 100 }
    ];
  }

  function shoot(x, y) {
  const now = performance.now();

  if (health <= 0) return;

  if (isReloading) {
    say("正在换弹，暂时不能射击。");
    return;
  }

  if (ammo <= 0) {
    reload();
    return;
  }

  if (now - lastShotTime < SHOT_INTERVAL) return;

  lastShotTime = now;
  ammo--;
  shots++;

  const part = getTargetParts().find(function (part) {
    return insideRect(x, y, part.x, part.y, part.w, part.h);
  });

  shotEffect = {
    x,
    y,
    hit: Boolean(part),
    until: now + 180
  };

  if (part) {
    hits++;
    health = Math.max(0, health - part.damage);

    say("命中" + part.name + "，造成 " + part.damage + " 点伤害。");

    if (health === 0) {
      kills++;

      let reward = 225;

      if (part.name === "头部") {
        reward = 300;
      } else if (part.name === "上身") {
        reward = 250;
      }

      coins += reward;
      respawnAt = now + 3000;

      say(
        "击败目标！最后一击：" + part.name +
        "，获得 " + reward + " 金币。3秒后出现新目标。"
      );
    }
  } else {
    say("未命中，调整准星再试一次。");
  }

  updateScreen();

  if (ammo === 0) reload();
}

  function reload() {
    if (isReloading || ammo === MAGAZINE_SIZE) return;

    isReloading = true;
    reloadEndsAt = performance.now() + RELOAD_TIME;
    say("换弹中……需要1.5秒。");
    updateScreen();
  }

  function restart() {
    coins = 0;
    health = 100;
    ammo = MAGAZINE_SIZE;
    kills = 0;
    shots = 0;
    hits = 0;
    isReloading = false;
    reloadEndsAt = 0;
    respawnAt = 0;
    lastShotTime = -Infinity;
    shotEffect = null;
    target.x = 450;
    target.direction = 1;
    say("新一轮开始，瞄准移动目标！");
    updateScreen();
  }

  canvas.addEventListener("pointermove", function (event) {
    const position = getPosition(event);
    mouse.x = position.x;
    mouse.y = position.y;
    mouse.inside = true;
  });

  canvas.addEventListener("pointerleave", function () {
    mouse.inside = false;
  });

  canvas.addEventListener("pointerdown", function (event) {
    if (event.button !== 0) return;
    const position = getPosition(event);
    shoot(position.x, position.y);
  });

  reloadButton.addEventListener("click", reload);
  document.getElementById("restartButton")
    .addEventListener("click", restart);

  document.addEventListener("keydown", function (event) {
    if (event.key.toLowerCase() === "r" &&
        !event.repeat && !event.metaKey &&
        !event.ctrlKey && !event.altKey) {
      reload();
    }
  });

  function draw(now) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 背景网格
    ctx.strokeStyle = "#20334d";
    ctx.lineWidth = 1;
    for (let x = 0; x <= 900; x += 50) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, 480);
      ctx.stroke();
    }
    for (let y = 0; y <= 480; y += 50) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(900, y);
      ctx.stroke();
    }

    ctx.fillStyle = "#203b50";
    ctx.fillRect(0, 390, 900, 90);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    if (health > 0) {
      // 目标血条
      ctx.fillStyle = "#344155";
      ctx.fillRect(target.x - 50, 105, 100, 10);
      ctx.fillStyle = "#69dfaa";
      ctx.fillRect(target.x - 50, 105, health, 10);

      for (const part of getTargetParts()) {
        ctx.fillStyle = part.color;
        ctx.fillRect(part.x, part.y, part.w, part.h);
        ctx.fillStyle = "#132238";
        ctx.font = "16px sans-serif";
        ctx.fillText(part.name, target.x, part.y + part.h / 2);
      }
    } else {
      const seconds = Math.max(1, Math.ceil((respawnAt - now) / 1000));
      ctx.fillStyle = "#edf4ff";
      ctx.font = "28px sans-serif";
      ctx.fillText("目标已击败 · " + seconds + "秒后重生", 450, 240);
    }

    // 命中或打空的短暂反馈
    if (shotEffect && now < shotEffect.until) {
      ctx.strokeStyle = shotEffect.hit ? "#fff098" : "#ff7e89";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(shotEffect.x, shotEffect.y, 13, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 鼠标准星
    if (mouse.inside) {
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(mouse.x - 10, mouse.y);
      ctx.lineTo(mouse.x + 10, mouse.y);
      ctx.moveTo(mouse.x, mouse.y - 10);
      ctx.lineTo(mouse.x, mouse.y + 10);
      ctx.stroke();
    }

    // 换弹进度条
    if (isReloading) {
      const progress = Math.max(0, Math.min(
        1, 1 - (reloadEndsAt - now) / RELOAD_TIME
      ));
      ctx.fillStyle = "#344155";
      ctx.fillRect(300, 435, 300, 10);
      ctx.fillStyle = "#65baff";
      ctx.fillRect(300, 435, 300 * progress, 10);
    }
  }

  let previousTime = performance.now();

  function frame(now) {
    // 用经过的秒数计算位移，减少不同屏幕帧率的影响
    const seconds = Math.min((now - previousTime) / 1000, 0.05);
    previousTime = now;

    if (isReloading && now >= reloadEndsAt) {
      ammo = MAGAZINE_SIZE;
      isReloading = false;
      say(health > 0 ? "换弹完成！" : "换弹完成，等待新目标。");
      updateScreen();
    }

    if (health <= 0 && now >= respawnAt) {
      health = 100;
      target.x = 450;
      say(isReloading ? "新目标出现，正在换弹。" : "新目标出现！");
      updateScreen();
    }

    if (health > 0) {
      target.x += TARGET_SPEED * target.direction * seconds;

      if (target.x >= 810) {
        target.x = 810;
        target.direction = -1;
      } else if (target.x <= 90) {
        target.x = 90;
        target.direction = 1;
      }
    }

    draw(now);
    requestAnimationFrame(frame);
  }

  updateScreen();
  requestAnimationFrame(frame);
</script>
</body>
</html>
